version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /etc
    - /lib
    - /vault
    - /var/log
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  _provider_nvidia:
    name: _provider_nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /sandbox/.venv/bin/python3
      - path: /usr/bin/python3
      - path: /usr/bin/curl
      - path: /usr/local/bin/curl
  nvidia-api-catalog:
    name: NVIDIA API Catalog chat only (development route)
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      - path: /sandbox/.venv/bin/python3
      - path: /usr/bin/python3
      - path: /usr/bin/curl
  radio-officer:
    name: Radio Officer drafts and questions
    endpoints:
      - host: host.openshell.internal
        port: 8787
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /drafts
          - allow:
              method: POST
              path: /questions
          - allow:
              method: GET
              path: /inbox
          - allow:
              method: POST
              path: /vault/identifiers
    binaries:
      - path: /sandbox/.venv/bin/python3
      - path: /usr/bin/python3
      - path: /usr/bin/curl
  tavily:
    name: Tavily search and extract
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /search
          - allow:
              method: POST
              path: /extract
    binaries:
      - path: /sandbox/.venv/bin/python3
      - path: /usr/bin/python3
      - path: /usr/bin/curl
  token-factory:
    name: Nebius Token Factory chat only
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      - path: /sandbox/.venv/bin/python3
      - path: /usr/bin/python3
      - path: /usr/bin/curl
network_middlewares:
  dogwatch-seal:
    name: Dogwatch Seal
    middleware: dogwatch-seal
    order: 10
    on_error: fail_closed
    endpoints:
      include:
        - api.tokenfactory.nebius.com
        - integrate.api.nvidia.com
        - api.tavily.com
        - host.openshell.internal