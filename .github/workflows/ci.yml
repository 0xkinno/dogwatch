name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  copy-check:
    name: copy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Facts match result files
        run: python scripts/check_facts.py
      - name: House style (no emoji, no dashes, banned words)
        run: python scripts/check_copy.py
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: core
        run: cd core && python -m pytest -q
      - name: radio
        run: cd radio && python -m pytest -q
      - name: seal
        run: cd seal && python -m pytest -q
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit
      - run: cd web && npx next build
  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --timeout 30 --accept "200..=299,301,302,403,429,999" --exclude "localhost" --exclude "shields.io" --exclude "api.tokenfactory.nebius.com" --exclude "0xkinno/dogwatch/actions" README.md JUDGE.md MOMENT.md PROOF.md EVIDENCE.md SPONSOR_INTEL.md SUBMISSION_DEVPOST.md
          fail: true
