# Stock NVIDIA provider profile from NVIDIA/OpenShell (providers/nvidia.yaml, Apache-2.0), with the binaries list
# edited to the interpreters used by Dogwatch. Attached for the nvidia_build development route.
# Credential: NVIDIA_API_KEY, bearer, to integrate.api.nvidia.com only.
id: nvidia
display_name: NVIDIA
description: NVIDIA inference endpoints
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/sandbox/.venv/bin/python3, /usr/bin/python3, /usr/bin/curl, /usr/local/bin/curl]
