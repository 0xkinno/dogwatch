# Tavily provider profile. Status: written from the example, lint and import pending (PLATFORM_PROBE.md).
id: tavily
display_name: Tavily
description: Tavily search and extract
category: search
inference_capable: false
credentials:
  - name: api_key
    description: Tavily API key
    env_vars: [TAVILY_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.tavily.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/sandbox/.venv/bin/python3, /usr/bin/curl]
